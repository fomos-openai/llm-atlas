name: validate-knowledge
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: node scripts/validate_structure.mjs
      - run: node scripts/validate_content.mjs
      - run: node scripts/validate_sources.mjs
      - run: node scripts/validate_catalogs.mjs
      - run: python scripts/validate_labs.py

