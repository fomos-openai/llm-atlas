name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate_structure.mjs
      - run: node scripts/validate_links.mjs
      - run: node scripts/validate_catalogs.mjs

