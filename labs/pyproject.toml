[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-atlas-lab"
version = "2.0.0"
description = "Reproducible small-model training and self-evolution labs for LLM Atlas"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "transformers>=4.51",
  "datasets>=3.0",
  "tokenizers>=0.20",
  "accelerate>=1.0",
  "peft>=0.13",
  "trl>=0.17",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
serve = ["vllm>=0.8"]
dev = ["pytest>=8.0"]

[project.scripts]
atlas-lab = "llm_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
